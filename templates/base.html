<!doctype html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Clinfo{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #222; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.08); margin-bottom: 20px; }
    .row { display: grid; grid-template-columns: repeat(auto-fit,minmax(320px,1fr)); gap: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #eee; text-align: left; padding: 10px 8px; }
    th { background: #fafafa; }
    .btn { background: #2b66f6; color: #fff; border: 0; padding: 10px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display:inline-block; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .error { color: #a20000; background: #ffe8e8; padding: 8px; border-radius: 8px; }
    input { width:100%; padding: 10px; border-radius: 8px; border:1px solid #ddd; margin-top:6px; margin-bottom:12px; }
    .totals { display:flex; gap:12px; flex-wrap:wrap; }
    .pill { background:#eff4ff; border-radius:20px; padding:8px 12px; font-size:13px; }
  </style>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
